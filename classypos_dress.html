<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ClassyPOS - Dress Shop</title>
<style>
:root{--bg:#ecf0f5;--card:#fff;--tx:#333;--b:#d6dbe3;--in:#fff;--hd:#3b8dbd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a222c;--card:#242f3c;--tx:#e6ebf1;--b:#3a4857;--in:#1a222c}}
:root[data-theme="dark"]{--bg:#1a222c;--card:#242f3c;--tx:#e6ebf1;--b:#3a4857;--in:#1a222c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,"Segoe UI",Roboto,sans-serif;padding-bottom:20px}
.brand{background:#3a82ad;color:#fff;text-align:center;font:700 28px/1.8 "Trebuchet MS",sans-serif;letter-spacing:1px}
.hb{background:var(--hd);color:#fff;display:flex;align-items:center;gap:6px;padding:12px;font-size:20px}.hb span{flex:1;text-align:center}.hb button{background:none;border:0;color:#fff;font-size:22px;padding:2px 5px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8}
#side{display:none;position:absolute;top:100%;left:0;width:62%;max-height:calc(100vh - 100px);overflow:auto;background:#222d32;color:#cfd8dc}#side.on{display:block}#side input{background:#374750;border:0;color:#fff;margin:10px;width:calc(100% - 20px)}#side h4{margin:0;padding:12px 14px;background:#1a2226;color:#4b646f;font-weight:400;font-size:14px;text-transform:uppercase}#side a{display:block;padding:12px 16px;cursor:pointer}#side a.p{font-size:17px}#side a.s{background:#2c3b41;padding-left:26px;font-size:15px}body.sb main{margin-left:62%;max-width:none;overflow:hidden}.lb{background:#fff;color:#000;border:1px dashed #999;padding:4px;text-align:center;font:11px monospace;margin:3px}
main{padding:14px;max-width:1100px;margin:auto}
h2{font-weight:400;margin:4px 0 12px;font-size:26px}
.card{background:var(--card);border-top:3px solid #d2d6de;border-radius:3px;padding:14px;margin-bottom:14px;box-shadow:0 1px 2px #0002}.card h3{margin:0 0 10px;font-weight:400;font-size:19px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:0;max-width:520px;margin:auto}
.t{border:0;color:#fff;padding:16px 4px;font:inherit;font-size:17px;text-align:center;cursor:pointer;line-height:1.5}.t i{display:block;font-style:normal;font-size:22px}
.c1{background:#00c0ef}.c2{background:#00a65a}.c3{background:#605ca8}.c4{background:#f39c12}.c5{background:#dd4b39}.c6{background:#001f3f}.c7{background:#d81b60}.c8{background:#3d9970}
.big{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:20px 8px}.big div{color:#fff;text-align:center;border-radius:3px;overflow:hidden;cursor:pointer}.big b{display:block;font:700 40px/1.2 inherit;padding:28px 0 4px}.big p{margin:0 0 30px}.big u{display:block;background:#0003;text-decoration:none;padding:8px}
.nt{background:#111;color:#fff;text-align:center;padding:16px;margin:0 8px;max-width:340px;border-radius:3px}.nt h3{text-decoration:underline;font-weight:600}.nt button{background:#00a65a;color:#fff;border:0;padding:10px 16px;border-radius:3px;font:inherit}
.st{display:flex;background:var(--card);box-shadow:0 1px 2px #0002;margin-bottom:12px;min-height:84px}.st i{width:84px;display:grid;place-items:center;color:#fff;font-style:normal;font-size:34px}.st div{padding:10px 14px;display:flex;flex-direction:column;justify-content:center}.st small{text-transform:uppercase;font-size:13px}.st b{font-size:22px}
input,select{background:var(--in);color:var(--tx);border:1px solid var(--b);padding:8px;font:inherit;min-width:0;width:100%;border-radius:0}
.btn{border:0;color:#fff;background:#0073b7;padding:9px 12px;font:inherit;border-radius:3px;cursor:pointer}.g{background:#00a65a}.r{background:#dd4b39}.pu{background:#9390c4}
.bts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.tl{color:#f00;font:700 40px/1.1 inherit;letter-spacing:3px;margin:6px 0 12px}
.pos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ig{display:flex;border:1px solid var(--b);background:var(--card)}.ig span{padding:8px 12px;display:grid;place-items:center}.ig input{border:0}.ig button{border:0;background:#0001;color:var(--tx);font-size:20px;padding:0 14px}
.box{background:var(--card);border-top:3px solid #00a65a;min-height:320px;padding:6px}.pb{background:var(--card);border:1px solid var(--b);height:420px;overflow:auto;padding:10px}.pb h2{text-align:center;font-size:28px}
.pi{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--b);padding:9px 2px;font:inherit;color:var(--tx);cursor:pointer}.pi small{display:block;opacity:.7}
.ci{border-bottom:1px solid var(--b);padding:6px 2px;font-size:14px}.ci div{display:flex;align-items:center;gap:4px}.q{width:26px;height:26px;border:1px solid var(--b);background:var(--card);color:var(--tx)}
#bar{position:fixed;left:0;right:0;bottom:0;background:#001f3f;color:#fff;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));display:none;z-index:7;gap:8px;align-items:center;font-size:15px}#bar.on{display:flex}
#bar div{flex:1}#bar b{font-size:18px}#bar input{width:70px;padding:4px}
.ov{position:fixed;inset:0;background:#0008;display:none;z-index:9;align-items:center;justify-content:center;padding:14px}.ov.on{display:flex}.mb{background:var(--card);width:100%;max-width:420px;padding:16px;max-height:90vh;overflow:auto}.mb label{display:block;margin:6px 0 2px;font-size:13px}
table{width:100%;border-collapse:collapse}td,th{padding:7px 5px;border-bottom:1px solid var(--b);text-align:left}.sc{overflow-x:auto}.row{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}.row>*{flex:1 1 110px}.low{color:#dd4b39;font-weight:700}
#rc{display:none}@media print{body>*:not(#rc){display:none!important}#rc{display:block;width:72mm;color:#000;background:#fff;font:12px monospace}#rc td{border:0;padding:1px}}
</style></head><body>
<div class="top"><div id="top"></div><div id="side"></div></div><main id="app"></main><div id="bar"></div><div class="ov" id="md"></div><div id="rc"></div>
<script>
const K='classypos_dress_v1',$=s=>document.querySelector(s),e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const m=n=>'৳'+(Math.round(n*100)/100).toLocaleString('en-IN'),dt=d=>{d=new Date(d);return String(d.getDate()).padStart(2,'0')+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+d.getFullYear()};
const P=(id,name,v,price,cost,stock)=>({id,name,v,code:'D'+String(id).padStart(3,'0'),bc:String(30000000+id),price,cost,stock,min:3});
let db,PV,V='home',cart=[],cust='',disc=0,vr=5,edit=null,okFn=null;
try{db=JSON.parse(localStorage.getItem(K))}catch(x){}
db=db||{n:1,vat:5,shop:'Mim Fashion',products:[P(1,'Cotton Kurti','M / Red',850,600,12),P(2,'Cotton Kurti','L / Red',850,600,10),P(3,'Silk Saree','Blue',3200,2400,6),P(4,'Salwar Kameez 3pc','M / Green',2400,1750,8),P(5,'Georgette Gown','L / Black',3800,2800,4),P(6,'Girls Frock','5Y / Pink',950,650,2),P(7,'Palazzo Pants','M / White',650,430,15),P(8,'Dupatta','Maroon',450,280,0)],customers:[{id:1,name:'Nusrat Jahan',phone:'01711000001',due:0},{id:2,name:'Farhana Akter',phone:'01811000002',due:1200}],sales:[],returns:[],waste:[],vendor:[],income:[],expense:[],hrm:[],bank:[]};
vr=db.vat;['cat','pur','rpur','dist'].forEach(k=>db[k]=db[k]||[]);if(!db.cat.length)db.cat=['Kurti','Saree','Gown','Frock','Pants','Dupatta'].map(n=>({date:new Date().toISOString(),name:n}));const save=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch(x){}};
const LS={vendor:['Vendor',[['name','Name'],['phone','Phone'],['payable','Payable','number']]],income:['Income',[['note','Description'],['amount','Amount','number']]],expense:['Expense',[['note','Description'],['amount','Amount','number']]],hrm:['HRM',[['name','Name'],['role','Role'],['salary','Salary','number']]],bank:['Bank',[['type','Type','select','Deposit,Withdraw'],['note','Note'],['amount','Amount','number']]]};
const TI={home:'Home',dash:'Dashboard',pos:'Summary Report',inv:'Invoice List',cust:'Customer',prod:'Products',day:'Day Summary',waste:'Waste',report:'Report',settings:'Settings',backup:'Backup & Restore'};
const MENU=[['home','Home'],['dash','Dashboard'],['pos','Sales (POS)'],['prod','Products'],['inv','Invoice List'],['cust','Customer'],['vendor','Vendor'],['income','Income'],['expense','Expense'],['bank','Bank'],['day','Day Summary'],['hrm','HRM'],['waste','Waste'],['report','Report'],['settings','Settings'],['backup','Backup & Restore']];
const sum=(a,f)=>a.reduce((x,y)=>x+f(y),0),prof=s=>sum(s.items,i=>(i.price-i.cost)*i.qty)-s.disc,today=a=>a.filter(x=>dt(x.date)==dt(new Date()));
function go(v){PV=V;V=v;if(v=='vnew')VE=null;document.body.classList.remove('sb');if(v=='pos'){cart=[];cust='';disc=0}edit=null;$('#side').className='';render();scrollTo(0,0)}
function render(){
$('#top').innerHTML=(V=='pos'?'':'<div class="brand">ClassyPOS</div>')+(V=='home'?'':`<div class="hb"><button onclick="tg()">☰</button><span>${TI[V]||LS[V]?.[0]}</span><button onclick="go(PV||'dash')">←</button><button onclick="mCalc()">▦</button><button onclick="go('cust')">👤</button><button onclick="go('settings')">⚙</button><button onclick="go('home')">⌂</button></div>`);
side();
$('#app').innerHTML=(VW[V]||(()=>lst(V)))();$('#bar').className=V=='pos'?'on':'';
if(V=='pos'){pl();cr();bar()}if(V=='prod')plr();if(V=='vendor')vlr();if(V=='pnewp')lpick();document.body.style.paddingBottom=V=='pos'?'90px':'20px'}
const tile=(c,i,l,v)=>`<button class="t ${c}" onclick="go('${v}')"><i>${i}</i>${l}</button>`;
function cards(){const ts=today(db.sales),tr=today(db.returns),P=db.products,
profit=sum(ts,prof)-sum(tr,r=>r.loss),bal=sum(db.bank,b=>b.type=='Deposit'?b.amount:-b.amount);
return[['c1','🛍','Today\'s total sales',m(sum(ts,s=>s.total)-sum(tr,r=>r.amount))],['c2','৳','Today\'s profit',m(profit)],['c5','T','Today\'s total VAT',m(sum(ts,s=>s.vat))],['c4','↧','Today\'s expense',m(sum(today(db.expense),x=>x.amount))],['c8','↥','Today\'s income',m(sum(today(db.income),x=>x.amount))],['c3','☺','Receivable (customer due)',m(sum(db.customers,c=>c.due))],['c6','▦','Stock value (cost)',m(sum(P,p=>p.stock*p.cost))],['c7','!','Low / out of stock',P.filter(p=>p.stock>0&&p.stock<=p.min).length+' / '+P.filter(p=>p.stock<=0).length],['c1','🏦','Bank balance',m(bal)]].map(s=>`<div class="st"><i class="${s[0]}">${s[1]}</i><div><small>${s[2]}</small><b>${s[3]}</b></div></div>`).join('')}
const VW={
home:()=>`<div class="big"><div class="c3" onclick="go('pos')"><b>Sales</b><p>Operation</p><u>Enter ➜</u></div><div class="c7" onclick="go('dash')"><b>Admin</b><p>Management</p><u>Enter ➜</u></div></div><div class="nt"><h3>Notice</h3><p>Dear staff, please check stock and update prices before the new collection goes on sale.</p><button onclick="go('prod')">Products</button></div>`,
dash:()=>`<h2>Dashboard</h2><div class="card"><h3>Quick Access</h3><div class="tiles">${tile('c1','P','Invoice List','inv')+tile('c2','👤','Vendor','vendor')+tile('c3','👤','Customer','cust')+tile('c8','🔖','Income','income')+tile('c4','🔖','Expense','expense')+tile('c5','🏛','Bank','bank')+tile('c6','⌂','Day Summary','day')+tile('c6','✍','HRM','hrm')+tile('c3','♻','Waste','waste')+tile('c8','🖶','Report','report')+tile('c6','⚙','Settings','settings')+tile('c6','⭳','Backup & Restore','backup')}</div></div><div class="card"><h3>Today Summary</h3>${cards()}</div>`,
day:()=>`<h2>Day Summary</h2><div class="card">${cards()}</div>`+`<div class="card sc"><h3>Today's invoices</h3>${invT(today(db.sales).reverse())}</div>`,
pos:()=>`<div class="bts"><button class="btn" onclick="mRep()">Replace</button><button class="btn" onclick="mCust()">Customer${cust?': '+e(db.customers.find(c=>c.id==cust)?.name):''}</button><button class="btn pu" onclick="mAdv()">Advance</button><button class="btn r" onclick="mBank('Withdraw')">Bank Withdraw</button><button class="btn g" onclick="mBank('Deposit')">Bank Deposit</button></div><div class="tl" id="tl">Total:</div>
<div class="pos"><div><div class="ig"><span>▥</span><input id="q" placeholder="Search/Scan" onkeydown="if(event.key=='Enter')scan(this)"><button onclick="scan($('#q'))">+</button></div><div class="box" id="cr"></div></div><div><div class="ig"><span>🔍</span><input id="ps" placeholder="Search Product" oninput="pl()"></div><div class="pb"><h2>${e(db.shop)}</h2><div id="pl"></div></div></div></div>`,
inv:()=>`<h2>Invoice List</h2><div class="card sc">${invT([...db.sales].reverse())}</div>`,
cust:()=>`<h2>Customer</h2><div class="card"><div class="row"><input id="cn" placeholder="Name"><input id="cp" placeholder="Phone"><button class="btn g" onclick="addC($('#cn').value,$('#cp').value);render()">Add</button></div></div><div class="card sc"><table><tr><th>Name</th><th>Phone</th><th>Balance</th><th>Collect</th></tr>${db.customers.map(c=>`<tr><td>${e(c.name)}</td><td>${e(c.phone)}</td><td class="${c.due>0?'low':''}">${c.due<0?'Advance '+m(-c.due):m(c.due)}</td><td><div class="row"><input id="cl${c.id}" type="number" min="0" placeholder="Amount"><button class="btn g" onclick="adv(${c.id},+$('#cl${c.id}').value)">Collect</button></div></td></tr>`).join('')}</table></div>`,
prod:()=>{const p=edit?db.products.find(x=>x.id==edit):{},f=(i,l,v,t='text')=>`<div><small>${l}</small><input id="f_${i}" type="${t}" value="${e(v)}"></div>`;
return`<h2>Products</h2><div class="card"><div class="row">${f('name','Name',p.name)}${f('v','Size / Color',p.v)}${f('code','Code',p.code)}${f('bc','Barcode (blank=auto)',p.bc)}${f('cost','Purchase price',p.cost,'number')}${f('price','Selling price',p.price,'number')}${f('stock','Stock',p.stock,'number')}${f('min','Min stock',p.min,'number')}<div><small>Category</small><select id="f_cat"><option></option>${db.cat.map(c=>`<option ${p.cat==c.name?'selected':''}>${e(c.name)}</option>`).join('')}</select></div></div><button class="btn g" onclick="saveP()">Save</button> ${edit?'<button class="btn" onclick="go(\'prod\')">Cancel</button>':''}</div><div class="card sc"><table><tr><th>Item</th><th>Barcode</th><th>Price</th><th>Stock</th><th></th></tr>${db.products.map(p=>`<tr><td>${p.img?`<img src="${p.img}" style="width:36px;height:36px;object-fit:cover;float:left;margin-right:6px">`:''}${e(p.name)}<br><small>${e(p.v)} · ${e(p.code)}${p.vendor?' · '+e(p.vendor):''}</small></td><td>${e(p.bc)}</td><td>${m(p.price)}</td><td class="${p.stock<=p.min?'low':''}">${p.stock}</td><td><button class="btn" onclick="edit=${p.id};V='pnew';render()">Edit</button> <button class="btn r" onclick="if(confirm('Delete?')){db.products=db.products.filter(x=>x.id!=${p.id});save();render()}">×</button></td></tr>`).join('')}</table></div>`},
waste:()=>`<h2>Waste</h2><div class="card"><div class="row"><select id="wp">${db.products.map(p=>`<option value="${p.id}">${e(p.name)} ${e(p.v)} (${p.stock})</option>`).join('')}</select><input id="wq" type="number" min="1" placeholder="Qty"><input id="wr" placeholder="Reason (damaged...)"><button class="btn g" onclick="addW()">Add</button></div></div><div class="card sc"><table><tr><th>Date</th><th>Item</th><th>Qty</th><th>Loss</th></tr>${db.waste.map(w=>`<tr><td>${dt(w.date)}</td><td>${e(w.name)}<br><small>${e(w.note)}</small></td><td>${w.qty}</td><td>${m(w.loss)}</td></tr>`).join('')}</table></div>`,
report:()=>`<h2>Report</h2><div class="card"><div class="row"><input id="rf" type="date" oninput="rep()"><input id="rt" type="date" oninput="rep()"></div><div id="rr" class="sc"></div></div>`,
settings:()=>`<h2>Settings</h2><div class="card"><label>Shop name</label><input id="sn" value="${e(db.shop)}"><label>VAT %</label><input id="sv" type="number" value="${db.vat}"><br><br><button class="btn g" onclick="db.shop=$('#sn').value||db.shop;db.vat=vr=+$('#sv').value||0;save();alert('Saved')">Save</button></div>`,
backup:()=>`<h2>Backup & Restore</h2><div class="card"><p>Copy this text and keep it safe. To restore, paste a backup and press Restore.</p><textarea id="bk" rows="8" style="width:100%;background:var(--in);color:var(--tx)">${e(JSON.stringify(db))}</textarea><br><br><button class="btn r" onclick="try{db=JSON.parse($('#bk').value);save();alert('Restored');go('home')}catch(x){alert('Invalid backup')}">Restore</button></div>`};
function invT(a){return`<table><tr><th>Date</th><th>No</th><th>Customer</th><th>Total</th><th>Due</th><th></th></tr>${a.map(s=>`<tr><td>${dt(s.date)}</td><td>${s.no}</td><td>${e(s.cust||'Walk-in')}</td><td>${m(s.total)}</td><td class="${s.due?'low':''}">${m(s.due)}</td><td><button class="btn" onclick="pr(${s.no})">Print</button></td></tr>`).join('')||'<tr><td>No invoices yet.</td></tr>'}</table>`}
function lst(k){if(!LS[k])return'';const f=LS[k][1];return`<h2>${LS[k][0]}</h2>${k=='bank'?`<div class="card">Balance: <b>${m(sum(db.bank,b=>b.type=='Deposit'?b.amount:-b.amount))}</b></div>`:''}<div class="card"><div class="row">${f.map(x=>x[2]=='select'?`<select id="l_${x[0]}">${x[3].split(',').map(o=>`<option>${o}</option>`).join('')}</select>`:`<input id="l_${x[0]}" type="${x[2]||'text'}" placeholder="${x[1]}">`).join('')}<button class="btn g" onclick="addL('${k}')">Add</button></div></div><div class="card sc"><table><tr><th>Date</th>${f.map(x=>`<th>${x[1]}</th>`).join('')}<th></th></tr>${db[k].map((r,i)=>`<tr><td>${dt(r.date)}</td>${f.map(x=>`<td>${x[2]=='number'?m(r[x[0]]):e(r[x[0]])}</td>`).join('')}<td><button class="btn r" onclick="db['${k}'].splice(${i},1);save();render()">×</button></td></tr>`).join('')}</table></div>`}
function addL(k){const r={date:new Date().toISOString()};for(const x of LS[k][1]){const v=$('#l_'+x[0]).value.trim();r[x[0]]=x[2]=='number'?+v||0:v}if(!LS[k][1].some(x=>r[x[0]]))return;db[k].push(r);save();render()}
function addW(){const p=db.products.find(p=>p.id==$('#wp').value),q=+$('#wq').value;if(!p||q<1||q>p.stock){alert('Check quantity vs stock');return}p.stock-=q;db.waste.push({date:new Date().toISOString(),name:p.name+' '+p.v,qty:q,loss:q*p.cost,note:$('#wr').value});save();render()}
function rep(){const f=$('#rf').value,t=$('#rt').value,a=db.sales.filter(s=>{const d=s.date.slice(0,10);return(!f||d>=f)&&(!t||d<=t)});$('#rr').innerHTML=`<table><tr><td>Invoices</td><td>${a.length}</td></tr><tr><td>Sales</td><td>${m(sum(a,s=>s.total))}</td></tr><tr><td>VAT</td><td>${m(sum(a,s=>s.vat))}</td></tr><tr><td>Profit (before returns)</td><td>${m(sum(a,prof))}</td></tr></table>`+invT(a.reverse())}
function saveP(){const v=i=>$('#f_'+i).value.trim(),n=x=>+x||0;if(!v('name')){alert('Name required');return}const bc=v('bc')||String(30000000+Math.floor(Math.random()*9e6));if(db.products.some(p=>p.id!=edit&&(p.bc==bc||(v('code')&&p.code==v('code'))))){alert('Duplicate barcode or code');return}const o={name:v('name'),v:v('v'),code:v('code'),bc,cost:n(v('cost')),price:n(v('price')),stock:n(v('stock')),min:n(v('min')),cat:v('cat'),vendor:v('vendor'),desc:v('desc'),unit:v('unit'),pref:n(v('pref')),img:window.IMG||(edit?db.products.find(p=>p.id==edit).img:'')};edit?Object.assign(db.products.find(p=>p.id==edit),o):db.products.push({id:Date.now(),date:new Date().toISOString(),...o});edit=null;save();go('prod')}
function addC(n,p){n=n.trim();if(!n)return null;const c={id:Date.now(),name:n,phone:p.trim(),due:0};db.customers.push(c);save();return c}
function adv(id,a){if(a>0){db.customers.find(c=>c.id==id).due-=a;save();render()}}
/* POS */
function pl(){const q=($('#ps')?.value||'').toLowerCase();$('#pl').innerHTML=db.products.filter(p=>p.active!==false&&(!q||(p.name+p.v+p.code+p.bc).toLowerCase().includes(q))).map(p=>`<button class="pi" onclick="add(${p.id})">${e(p.name)}<small>${e(p.v)} · ${m(p.price)} · Stock ${p.stock}</small></button>`).join('')}
function scan(el){const v=el.value.trim().toLowerCase();if(!v)return;const p=db.products.find(p=>(p.bc==v||p.code.toLowerCase()==v)&&p.active!==false);p?(add(p.id),el.value=''):alert('No product found for '+v)}

function pLine(){const p=db.products.find(p=>p.id==$('#pp').value),q=+$('#pq').value,c=+$('#pb').value;if(!p||q<1||c<=0){alert('Enter qty and buy price');return}PC.push({id:p.id,name:p.name+' '+p.v,qty:q,cost:c});render()}
function pSave(){if(!PC.length){alert('Add items first');return}const v=PVn!==''?db.vendor[PVn]:null,tot=sum(PC,l=>l.qty*l.cost),paid=Math.min(+$('#pd').value||0,tot);if(!v&&paid<tot){alert('Select a vendor to keep an unpaid amount (add vendors in Vendor menu)');return}PC.forEach(l=>{const p=db.products.find(p=>p.id==l.id);p.cost=(p.stock*p.cost+l.qty*l.cost)/(p.stock+l.qty);p.stock+=l.qty});if(v)v.payable=(v.payable||0)+tot-paid;db.pur.push({no:db.pur.length+1,date:new Date().toISOString(),vendor:v?v.name:'Cash purchase',items:PC,total:tot,paid,inv:$('#pin').value.trim(),note:PN,method:PM});PC=[];PI=PD='';PM='Cash';PN='';save();go('purinv')}
VW.rpur=()=>`<h2>Return Purchase</h2><div class="card"><div class="row"><select id="rv">${vopt()}</select><select id="rp">${popt()}</select><input id="rq2" type="number" min="1" placeholder="Qty"><button class="btn g" onclick="rpSave()">Return</button></div></div>`;
function rpSave(){const v=db.vendor[$('#rv').value],p=db.products.find(p=>p.id==$('#rp').value),q=+$('#rq2').value;if(!v||!p||q<1||q>p.stock){alert('Select vendor, item and a qty within stock');return}const a=q*p.cost;p.stock-=q;v.payable=(v.payable||0)-a;db.rpur.push({date:new Date().toISOString(),vendor:v.name,name:p.name+' '+p.v,qty:q,amount:a});save();go('rpl')}
VW.rpl=()=>`<h2>Return Purchase List</h2><div class="card sc"><table><tr><th>Date</th><th>Vendor</th><th>Item</th><th>Qty</th><th>Amount</th></tr>${[...db.rpur].reverse().map(r=>`<tr><td>${dt(r.date)}</td><td>${e(r.vendor)}</td><td>${e(r.name)}</td><td>${r.qty}</td><td>${m(r.amount)}</td></tr>`).join('')}</table></div>`;
VW.dist=()=>`<h2>Distribute</h2><div class="card"><div class="row"><select id="dp">${popt()}</select><input id="dq" type="number" min="1" placeholder="Qty"><input id="dto" placeholder="To (branch / outlet)"><button class="btn g" onclick="dSave()">Distribute</button></div></div><div class="card sc"><table><tr><th>Date</th><th>Item</th><th>Qty</th><th>To</th></tr>${[...db.dist].reverse().map(d=>`<tr><td>${dt(d.date)}</td><td>${e(d.name)}</td><td>${d.qty}</td><td>${e(d.to)}</td></tr>`).join('')}</table></div>`;
function dSave(){const p=db.products.find(p=>p.id==$('#dp').value),q=+$('#dq').value,to=$('#dto').value.trim();if(!p||q<1||q>p.stock||!to){alert('Enter qty within stock and a destination');return}p.stock-=q;db.dist.push({date:new Date().toISOString(),name:p.name+' '+p.v,qty:q,to});save();render()}
const C39={0:'nnnwwnwnn',1:'wnnwnnnnw',2:'nnwwnnnnw',3:'wnwwnnnnn',4:'nnnwwnnnw',5:'wnnwwnnnn',6:'nnwwwnnnn',7:'nnnwnnwnw',8:'wnnwnnwnn',9:'nnwwnnwnn','*':'nwnnwnwnn'};
function bcsvg(t){let x=0,r='';for(const ch of '*'+t+'*'){[...C39[ch]].forEach((w,i)=>{const u=w=='w'?3:1;if(i%2==0)r+=`<rect x="${x}" width="${u}" height="40"/>`;x+=u});x+=1}return`<svg viewBox="0 0 ${x} 40" style="width:170px;height:40px" preserveAspectRatio="none">${r}</svg>`}
const lab=p=>`<div class="lb"><b>${e(db.shop)}</b><br>${e(p.name)} ${e(p.v)}<br>${bcsvg(p.bc)}<br>${p.bc} · ${m(p.price)}</div>`;
VW.bcode=()=>`<h2>Barcode</h2><div class="card"><div class="row"><select id="bp"><option value="all">All products</option>${popt()}</select><input id="bn" type="number" min="1" value="1"><button class="btn g" onclick="bPrint()">Print labels</button></div></div><div class="card" style="display:flex;flex-wrap:wrap">${db.products.map(lab).join('')}</div>`;
function bPrint(){const s=$('#bp').value,n=+$('#bn').value||1,a=s=='all'?db.products:[db.products.find(p=>p.id==s)];$('#rc').innerHTML=a.map(p=>lab(p).repeat(n)).join('');setTimeout(()=>window.print(),50)}
VW.stockr=()=>`<h2>Stock Report</h2><div class="card sc"><table><tr><th>Item</th><th>Stock</th><th>Cost</th><th>Value</th></tr>${db.products.map(p=>`<tr><td>${e(p.name)}<br><small>${e(p.v)}</small></td><td class="${p.stock<=p.min?'low':''}">${p.stock}</td><td>${m(p.cost)}</td><td>${m(p.stock*p.cost)}</td></tr>`).join('')}<tr><th>Total</th><th>${sum(db.products,p=>p.stock)}</th><th></th><th>${m(sum(db.products,p=>p.stock*p.cost))}</th></tr></table></div>`;
db.po=db.po||[];let OC=[],OV='';
Object.assign(TI,{pnewp:'New Purchase',pur:'Purchase',purl:'Purchase List',pord:'Purchase Order',purinv:'Purchase Invoice List'});
const _pur=VW.pur;
VW.pnewp=()=>{const h=_pur();return h.slice(0,h.indexOf('<div class="card sc">')).replace('<h2>Purchase</h2>','<h2>New Purchase</h2>')};
VW.pur=()=>`<h2>Purchase <small style="font-size:14px;opacity:.6">| Product Purchase</small></h2><div class="card" style="border-top-color:#3b8dbd"><div style="display:flex;flex-wrap:wrap;gap:2px">${[['🚚','New Purchase','pnewp'],['🚚','Purchase Return','rpur'],['≣','Purchase List','purl'],['≣','Purchase Order','pord'],['≣','Purchase Invoice List','purinv'],['≣','Purchase Return List','rpl']].map(x=>`<button class="t c6" style="width:130px" onclick="go('${x[2]}')"><i>${x[0]}</i>${x[1]}</button>`).join('')}</div></div>`;
VW.purl=()=>`<h2>Purchase List</h2><div class="card sc"><table><tr><th>Date</th><th>Inv</th><th>Vendor</th><th>Item</th><th>Qty</th><th>Cost</th><th>Amount</th></tr>${[...db.pur].reverse().flatMap(p=>p.items.map(l=>`<tr><td>${dt(p.date)}</td><td>${p.no}</td><td>${e(p.vendor)}</td><td>${e(l.name)}</td><td>${l.qty}</td><td>${m(l.cost)}</td><td>${m(l.qty*l.cost)}</td></tr>`)).join('')||'<tr><td>No purchase yet.</td></tr>'}</table></div>`;
VW.purinv=()=>`<h2>Purchase Invoice List</h2><div class="card sc"><table><tr><th>Date</th><th>No</th><th>Vendor</th><th>Total</th><th>Paid</th><th>Due</th><th></th></tr>${[...db.pur].reverse().map(p=>`<tr><td>${dt(p.date)}</td><td>${p.no}</td><td>${e(p.vendor)}</td><td>${m(p.total)}</td><td>${m(p.paid)}</td><td class="${p.total>p.paid?'low':''}">${m(p.total-p.paid)}</td><td><button class="btn" onclick="ppr(${p.no})">Print</button> ${p.total>p.paid?`<button class="btn g" onclick="ppay(${p.no})">Pay</button>`:''}</td></tr>`).join('')||'<tr><td>No invoice yet.</td></tr>'}</table></div>`;
function ppr(no){const p=db.pur.find(p=>p.no==no);$('#rc').innerHTML=`<center><b>${e(db.shop)}</b><br>Purchase Invoice #${p.no} · ${dt(p.date)}<br>${e(p.vendor)}</center><hr><table>${p.items.map(l=>`<tr><td>${e(l.name)}<br>${l.qty} × ${l.cost}</td><td align="right">${l.qty*l.cost}</td></tr>`).join('')}</table><hr><b>Total: ${m(p.total)}</b><br>Paid: ${m(p.paid)}<br>Due: ${m(p.total-p.paid)}`;setTimeout(()=>window.print(),50)}
function ppay(no){const p=db.pur.find(p=>p.no==no);M(`<h3>Pay invoice #${no}</h3><p>Due ${m(p.total-p.paid)}</p><input id="ppa" type="number" min="0" placeholder="Amount">`,()=>{const x=Math.min(+$('#ppa').value||0,p.total-p.paid);if(x<=0)return;p.paid+=x;const v=db.vendor.find(v=>v.name==p.vendor);if(v)v.payable=(v.payable||0)-x;save();X();render()},'Pay')}
VW.pord=()=>`<h2>Purchase Order</h2><div class="card"><div class="row"><select onchange="OV=this.value"><option value="">Select vendor</option>${db.vendor.map((v,i)=>`<option value="${i}" ${OV!==''&&OV==i?'selected':''}>${e(v.name)}</option>`).join('')}</select></div><div class="row"><select id="op">${popt()}</select><input id="oq" type="number" min="1" placeholder="Qty"><input id="oc" type="number" min="0" placeholder="Est. price"><button class="btn" onclick="oLine()">Add</button></div>${OC.map(l=>`<div class="ci">${e(l.name)} · ${l.qty} × ${m(l.cost)}</div>`).join('')}<br><button class="btn g" onclick="oSave()">Save order</button></div><div class="card sc"><table><tr><th>Date</th><th>No</th><th>Vendor</th><th>Total</th><th>Status</th><th></th></tr>${[...db.po].reverse().map(o=>`<tr><td>${dt(o.date)}</td><td>${o.no}</td><td>${e(o.vendor)}</td><td>${m(o.total)}</td><td>${o.status}</td><td>${o.status=='Pending'?`<button class="btn g" onclick="porec(${o.no})">Receive</button> <button class="btn r" onclick="db.po.find(x=>x.no==${o.no}).status='Cancelled';save();render()">×</button>`:''}</td></tr>`).join('')||'<tr><td>No order yet.</td></tr>'}</table></div>`;
function oLine(){const p=db.products.find(p=>p.id==$('#op').value),q=+$('#oq').value,c=+$('#oc').value;if(!p||q<1||c<=0){alert('Enter qty and price');return}OC.push({id:p.id,name:p.name+' '+p.v,qty:q,cost:c});render()}
function oSave(){const v=OV!==''?db.vendor[OV]:null;if(!v||!OC.length){alert('Select a vendor and add items');return}db.po.push({no:db.po.length+1,date:new Date().toISOString(),vendor:v.name,items:OC,total:sum(OC,l=>l.qty*l.cost),status:'Pending'});OC=[];save();render()}
function porec(no){const o=db.po.find(o=>o.no==no),v=db.vendor.find(v=>v.name==o.vendor);o.items.forEach(l=>{const p=db.products.find(p=>p.id==l.id);if(!p)return;p.cost=(p.stock*p.cost+l.qty*l.cost)/(p.stock+l.qty);p.stock+=l.qty});if(v)v.payable=(v.payable||0)+o.total;o.status='Received';db.pur.push({no:db.pur.length+1,date:new Date().toISOString(),vendor:o.vendor,items:o.items,total:o.total,paid:0});save();render()}
let PI='',PD='',PM='Cash',PN='',LC='';Object.assign(TI,{pnewp:'Product Purchase'});
const popt2=()=>db.products.filter(p=>p.active!==false&&(!LC||p.cat==LC)).map(p=>`<option value="${p.id}">${e(p.name)} ${e(p.v)} (${p.stock})</option>`).join('');
VW.pnewp=()=>{const t=sum(PC,l=>l.qty*l.cost),NL=(l,h,b)=>`<div class="ig" style="margin-bottom:8px"><span style="background:#001f3f;color:#fff;white-space:nowrap"><b>${l}</b></span>${h}${b?`<button style="background:#0073b7;color:#fff" onclick="${b}">+</button>`:''}</div>`;
return`<h2>Product Purchase <small style="font-size:14px;opacity:.6">| Purchase products according to purchase invoice</small></h2><div class="card" style="border-top-color:#3b8dbd">${NL('Invoice Number :',`<input id="pin" value="${e(PI)}" oninput="PI=this.value">`)}${NL('Supplier :',`<select style="border:0" onchange="PVn=this.value"><option value="">Select</option>${db.vendor.map((v,i)=>`<option value="${i}" ${PVn!==''&&PVn==i?'selected':''}>${e(v.name)}</option>`).join('')}</select>`,"mQ('vendor')")}${NL('Desc./IMEI :',`<input value="${e(PN)}" oninput="PN=this.value">`)}${NL('BarCode :',`<input id="lb" placeholder="Scan / enter code" onkeydown="if(event.key=='Enter')lscan()">`,'lscan()')}<div style="text-align:center;margin:10px 0"><b>Product</b> <button class="btn" onclick="go('pnew')">+</button></div>
<div class="row"><select id="lc" onchange="LC=this.value;$('#lpp').innerHTML=popt2();lpick()"><option value="">Cat</option>${db.cat.map(c=>`<option ${LC==c.name?'selected':''}>${e(c.name)}</option>`).join('')}</select><select id="lpp" onchange="lpick()">${popt2()}</select></div><div class="row"><input id="ld" placeholder="Description"></div><div class="row">${NL('Qty','<input id="lq" type="number" min="1" value="1" oninput="lt()">')}${NL('Price','<input id="lpr" type="number" min="0" placeholder="UnitPrice" oninput="lt()">')}${NL('Total','<input id="ltt" value="0" readonly>')}<button class="btn" style="flex:0 0 44px;height:38px" onclick="lAdd()">+</button></div>
${PC.map((l,i)=>`<div class="ci">${e(l.name)}${l.desc?' ('+e(l.desc)+')':''}<div><span style="flex:1">${l.qty} × ${m(l.cost)} = ${m(l.qty*l.cost)}</span><button class="q" onclick="PC.splice(${i},1);render()">×</button></div></div>`).join('')}<hr><div class="row">${NL('Total',`<input value="${t}" readonly>`)}${NL('Cash',`<input id="pd" type="number" min="0" placeholder="Paid" value="${e(PD)}" oninput="PD=this.value;pdue()">`)}${NL('Due',`<input id="pdu" readonly value="${Math.max(0,t-(+PD||0))}">`)}<select id="pm" onchange="PM=this.value">${['Cash','Bank','bKash','Nagad','Rocket'].map(x=>`<option ${PM==x?'selected':''}>${x}</option>`).join('')}</select></div><button class="btn" style="background:#6c7f9a" onclick="pSave()">Purchase</button> <button class="btn" style="background:#d81b60" onclick="pReset()">Reset</button> <button class="btn r" onclick="go('pur')">Cancel</button></div>`};
function lpick(){const p=db.products.find(p=>p.id==$('#lpp').value);if(p){$('#lpr').value=Math.round(p.cost);lt()}}
function lt(){$('#ltt').value=(+$('#lq').value||0)*(+$('#lpr').value||0)}
function pdue(){$('#pdu').value=Math.max(0,sum(PC,l=>l.qty*l.cost)-(+$('#pd').value||0))}
function lscan(){const v=$('#lb').value.trim().toLowerCase(),p=db.products.find(p=>p.bc==v||p.code.toLowerCase()==v);if(!p){alert('No product found for that code');return}LC='';$('#lc').value='';$('#lpp').innerHTML=popt2();$('#lpp').value=p.id;lpick();$('#lb').value='';$('#lq').focus()}
function lAdd(){const p=db.products.find(p=>p.id==$('#lpp').value),q=+$('#lq').value,c=+$('#lpr').value;if(!p||q<1||c<=0){alert('Select a product, qty and price');return}PC.push({id:p.id,name:p.name+' '+p.v,qty:q,cost:c,desc:$('#ld').value.trim()});render()}
function pReset(){PC=[];PI=PD=PN='';PM='Cash';PVn='';render()}
render();
</script></body></html>
